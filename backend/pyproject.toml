[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resort-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy==2.0.55",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migrations carry long SQL strings for CHECK constraints; wrapping them hurts reading.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the alembic
# package as first-party.
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real PostgreSQL test database (TEST_DATABASE_URL)",
]
